[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-harness"
version = "0.1.0"
description = "Script-driven local orchestration for the official LightX2V cloud API"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "pydantic>=2.9,<3", "Pillow>=10,<13", "jsonschema>=4.22,<5"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
video-harness = "video_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
video_harness = ["templates/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
